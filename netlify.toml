[build]
  command = "npm run build"
  publish = "dist/spa"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/aitoia.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/downloads/aitoia-codex.zip"
  [headers.values]
    Cache-Control = "public, no-cache"
    Content-Disposition = 'attachment; filename="AitoIA-by-AitoSoftwares.zip"'
