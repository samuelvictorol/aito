server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 1100m;
  location /comunicacao/app/ {
    try_files $uri $uri/ /comunicacao/app/index.html;
    add_header X-Content-Type-Options nosniff always;
  }
  location ~ ^/comunicacao/(?:api(?:/|$)|session(?:/|$)|socket\.io(?:/|$)|whatsapp-web/socket\.io(?:/|$)) {
    proxy_pass https://api.aitosoftwares.com;
    proxy_ssl_server_name on;
    proxy_ssl_name api.aitosoftwares.com;
    proxy_set_header Host api.aitosoftwares.com;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_http_version 1.1;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
    proxy_request_buffering off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
